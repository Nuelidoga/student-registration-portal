name: Deploy Infrastructure and Function App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy ARM Template
        run: |
          az deployment group create \
            --resource-group student-portal-iac-RG \
            --template-file infra/main.json \
            --parameters sqlServerName=student-portal-iac-20261 sqlAdminPassword='${{ secrets.SQL_ADMIN_PASSWORD }}' storageAccountName=studentportaliac2026 appServicePlanName=student-portal-plan functionAppName=student-portal-func-2026 appInsightsName=student-portal-insights

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: student-api

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: student-portal-func-2026
          package: student-api